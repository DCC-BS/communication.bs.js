name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    CI: true

permissions:
    contents: read

jobs:
    ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@e4b0133a84dbb31d57dd2389f22fce8b85cf55b7 # v10.0.4
        permissions:
            contents: read
            pull-requests: write
        # default check step: `mise run ci-check` (biome ci, publint, require()/import() of the build)
