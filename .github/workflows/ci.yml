name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    CI: true

permissions:
    contents: read

jobs:
    ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        permissions:
            contents: read
            pull-requests: write
        # default check step: `mise run ci-check` (biome ci, publint, require()/import() of the build)
