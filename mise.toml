[tools]
bun = "1.4.0"
node = "24.9.0"
usage = "3.5.6"

[hooks]
postinstall = { task = "install" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "install npm packages"
run = "bun install"

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "build the library with Vite"
run = "bunx vite build"

# ── Linting ───────────────────────────────────────────────────────────────────

[tasks.lint]
description = "format code with Biome"
run = "bunx biome format --write"

[tasks.check]
description = "check and fix linting issues"
run = "bunx biome check --fix"

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "run unit tests"
run = "bunx vitest"

[tasks."test:run"]
description = "run unit tests once"
run = "bunx vitest run"

[tasks."test:watch"]
description = "run unit tests in watch mode"
run = "bunx vitest --watch"
