[tools]
# TEMPORARY until 2026-10-29: bun 1.4.4 fixes CVE-2026-111497 (Brotli decoder) but is younger than
# the 7-day cooldown. The weekly dependency routine deletes this comment once 1.4.4 is 7 days old.
bun = "1.4.4"
node = "24.22.1"
usage = "7.0.1"

[hooks]
postinstall = { task = "install" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "install npm packages"
run = "bun install"

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "build the library with Vite"
run = [
    "bunx vite build",
    # same declarations for require() consumers (publint: CJS needs its own .d.cts)
    "cp dist/communication.bs.d.ts dist/communication.bs.d.cts",
]

# ── Linting ───────────────────────────────────────────────────────────────────

[tasks.lint]
description = "format code with Biome"
run = "bunx biome format --write"

[tasks.check]
description = "check and fix linting issues"
run = "bunx biome check --fix"

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "run unit tests"
run = "bunx vitest"

[tasks."test:run"]
description = "run unit tests once"
run = "bunx vitest run"

[tasks."test:watch"]
description = "run unit tests in watch mode"
run = "bunx vitest --watch"

[tasks.ci-check]
description = "lint, then check the built package: publint and a real require()/import() of every entry (run after build)"
run = [
    "bunx biome ci .",
    "bunx publint --strict",
    "node -e \"const m = require('@dcc-bs/communication.bs.js'); if (typeof m.apiFetch !== 'function') throw new Error('require() entry has no apiFetch')\"",
    "node --input-type=module -e \"const m = await import('@dcc-bs/communication.bs.js'); if (typeof m.apiFetch !== 'function') throw new Error('import() entry has no apiFetch')\"",
]
